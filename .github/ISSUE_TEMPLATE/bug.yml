name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please don't paste your account number, address, username or password. Diagnostics files are already redacted.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected and what you saw instead. Include entity IDs and states.
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.10.2"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: San Jose Water integration version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from Settings → System → Logs (enable debug logging for custom_components.sjwater_stats if you can).
      render: text
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Drag in the file from Settings → Devices & services → San Jose Water → ⋮ → Download diagnostics.
